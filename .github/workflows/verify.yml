# GammaRay Phase 0 verification. Synthetic fixtures only; no deployment or secrets.
# Keep this job name `verify` consistent with docs/CI_PLAN.md and branch protection.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'if (process.versions.node.split(".")[0] !== "24") { console.error("Node.js 24 required"); process.exit(1); }'

      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gammaray-bin"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/gitleaks" version

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Run complete repository verification
        run: npm run verify

      - name: Validate secret scanner positive and negative controls
        run: node scripts/check-secrets.mjs --self-test

      - name: Scan full Git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

      - name: Audit dependencies for high or critical vulnerabilities
        run: npm audit --audit-level=high
